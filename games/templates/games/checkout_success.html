<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Success - SellGame</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,rgba(102,192,244,.25),transparent 35%),
    radial-gradient(circle at top right,rgba(139,209,59,.18),transparent 30%),
    linear-gradient(135deg,#05080d,#0b141d 55%,#02040a);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.success-card{
    width:100%;
    max-width:760px;
    padding:50px;
    border-radius:34px;
    background:
    radial-gradient(circle at top,rgba(102,192,244,.18),transparent 42%),
    linear-gradient(180deg,#111827,#07111d);
    border:1px solid rgba(102,192,244,.25);
    box-shadow:0 35px 100px rgba(0,0,0,.55);
    text-align:center;
}

.success-icon{
    width:120px;
    height:120px;
    margin:0 auto 28px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
    background:linear-gradient(135deg,#8bd13b,#5da51f);
    box-shadow:0 0 45px rgba(139,209,59,.35);
}

.badge{
    display:inline-block;
    padding:10px 18px;
    border-radius:999px;
    background:rgba(139,209,59,.12);
    border:1px solid rgba(139,209,59,.35);
    color:#9aff4f;
    font-weight:900;
    margin-bottom:20px;
}

h1{
    font-size:48px;
    font-weight:900;
    margin-bottom:16px;
}

p{
    color:#c7d5e0;
    font-size:18px;
    line-height:1.8;
    max-width:560px;
    margin:0 auto 34px;
}

.info-box{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:34px;
}

.info{
    padding:18px;
    border-radius:20px;
    background:#0b1624;
    border:1px solid rgba(102,192,244,.18);
}

.info strong{
    display:block;
    font-size:22px;
    margin-bottom:6px;
}

.info span{
    color:#8ea3b8;
    font-size:14px;
    font-weight:800;
}

.actions{
    display:flex;
    justify-content:center;
    gap:16px;
}

.btn{
    height:58px;
    padding:0 28px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:white;
    font-weight:900;
    transition:.25s;
}

.btn-primary{
    background:linear-gradient(135deg,#66c0f4,#167ac0);
}

.btn-secondary{
    background:#142237;
    border:1px solid #2a475e;
    color:#c7d5e0;
}

.btn:hover{
    transform:translateY(-4px);
    filter:brightness(1.08);
}

@media(max-width:650px){
    .success-card{
        padding:32px 24px;
    }

    h1{
        font-size:36px;
    }

    .info-box{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="success-card">

    <div class="success-icon">✓</div>

    <div class="badge">PAYMENT COMPLETED</div>

    <h1>Payment Successful</h1>

    <p>
        All cart games have been added to your library. You can now download
        or play your purchased games anytime.
    </p>

    <div class="info-box">
        <div class="info">
            <strong>Paid</strong>
            <span>Status</span>
        </div>

        <div class="info">
            <strong>Library</strong>
            <span>Games Added</span>
        </div>

        <div class="info">
            <strong>Secure</strong>
            <span>Payment</span>
        </div>
    </div>

    <div class="actions">
        <a href="/library/" class="btn btn-primary">Go to Library</a>
        <a href="/" class="btn btn-secondary">Back to Store</a>
    </div>

</div>

</body>
</html>
